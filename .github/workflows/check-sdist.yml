name: "Check sdist"
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-sdist:
    # Don't run on forks
    if: github.repository == 'scikit-learn/scikit-learn'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Drop the compromised emSign root from the system CA store
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          dpkg-query -W ca-certificates
          test ! -e /etc/ssl/certs/emSign_ECC_Root_CA_-_G3.pem

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # scipy and cython are required to build sdist
        run: |
          python -m pip install --upgrade pip
          pip install check-sdist
      - run: |
          check-sdist --inject-junk

  update-tracker:
    uses: ./.github/workflows/update_tracking_issue.yml
    if: ${{ always() }}
    needs: [check-sdist]
    with:
      job_status: ${{ needs.check-sdist.result }}
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
