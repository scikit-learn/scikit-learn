name: AgentScan
# Scan the activity of the authors of new PRs and issues with AgentScan
# (https://agentscan.tools). When the activity looks automated, label the PR
# or issue and post a comment linking to the analysis and to our Automated
# Contributions Policy. Accounts with too little public activity only get a
# short "Insufficient data" comment. Nothing is posted for organic activity.
# Org members and authors with at least 10 merged PRs are not scanned.

permissions:
  contents: read

on:
  pull_request_target:
    types:
      - opened
      - reopened
  issues:
    types:
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  agentscan:
    if: github.repository == 'scikit-learn/scikit-learn'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The author association of the event reports org members with a private
      # membership as contributors, so membership is checked with a token that
      # can read it.
      - name: Check if the author is a member or a seasoned contributor
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          READ_ORG_TOKEN: ${{ secrets.BOT_GITHUB_READ_ORG_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          if GH_TOKEN="$READ_ORG_TOKEN" gh api "orgs/scikit-learn/members/$AUTHOR" --silent; then
            echo "$AUTHOR is an org member"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed search (bot account, API error) leaves the scan enabled.
          merged=$(gh api -X GET search/issues \
            -f q="repo:$GITHUB_REPOSITORY is:pr is:merged author:$AUTHOR" \
            -f per_page=1 --jq .total_count || true)
          echo "$AUTHOR has '$merged' merged PRs"
          if [[ "$merged" =~ ^[0-9]+$ ]] && (( merged >= 10 )); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: AgentScan
        if: steps.author.outputs.skip != 'true'
        uses: MatteoGabriele/agentscan-action@v2.8.0
        # A failed scan (GitHub API error, rate limit) should not show up as a
        # failed check on the PR of a contributor.
        continue-on-error: true
        with:
          mode: full
          scan-pull-requests: true
          scan-issues: true
          trusted-author-associations: "owner,member,collaborator"
          message-mixed: >-
            The activity of this account shows a mix of organic and automated
            patterns. This is a heuristic, not a proof that this contribution
            was generated by an AI tool. Please make sure it follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
          message-automation: >-
            The activity of this account shows signs of automation. This is a
            heuristic, not a proof that this contribution was generated by an
            AI tool. Please make sure it follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
          message-community-flagged: >-
            This account has been flagged as potentially automated by the
            AgentScan community. Please make sure this contribution follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
