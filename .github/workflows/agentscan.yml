name: AgentScan
# Scan the activity of the authors of new PRs and issues with AgentScan
# (https://agentscan.tools). When the activity looks automated, label the PR
# or issue and post a comment linking to the analysis and to our Automated
# Contributions Policy. Nothing is posted for organic activity.

permissions:
  contents: read

on:
  pull_request_target:
    types:
      - opened
      - reopened
  issues:
    types:
      - opened

jobs:
  agentscan:
    if: github.repository == 'scikit-learn/scikit-learn'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@7ad606f1e21df2119da8be99b763f282a670a1c5 # v2.8.0
        with:
          mode: full
          scan-pull-requests: true
          scan-issues: true
          trusted-author-associations: "owner,member,collaborator"
          message-mixed: >-
            The activity of this account shows a mix of organic and automated
            patterns. This is a heuristic, not a proof that this contribution
            was generated by an AI tool. Please make sure it follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
          message-automation: >-
            The activity of this account shows signs of automation. This is a
            heuristic, not a proof that this contribution was generated by an
            AI tool. Please make sure it follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
          message-community-flagged: >-
            This account has been flagged as potentially automated by the
            AgentScan community. Please make sure this contribution follows our
            [Automated Contributions Policy](https://scikit-learn.org/dev/developers/contributing.html#automated-contributions-policy).
