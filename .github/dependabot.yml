version: 2
updates:
  # Maintain dependencies for GitHub Actions as recommended in SPEC8:
  # https://github.com/scientific-python/specs/pull/325
  # Every `uses:` pointing to another repository references a full version tag,
  # and is pinned to a commit in .github/workflows/actions.lock, generated by
  # `gh actions-lock`. Dependabot updates the lockfile in its PRs.
  # The exception is the build-wheels workflow from scikit-learn-release,
  # which tracks @main.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "Build / CI"
      - "dependencies"
      - "Needs Triage"
