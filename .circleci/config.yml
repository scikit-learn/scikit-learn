version: 2.1

# The doc jobs below use the Linux VM executor rather than Docker because gen3
# resource classes are only offered on Linux VM (and remote Docker), and gen3 is
# both faster and cheaper per minute than its gen1 and gen2 equivalents. gen3 is
# an open beta, so drop the `.gen3` suffix if queue times or reliability become a
# problem. It is also only valid with the `current` image tag, not a pinned dated
# tag -- a pinned tag is rejected with "is not a valid resource class"
_machine_image: &machine_image
  image: ubuntu-2604:current

jobs:
  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: dependencies
          command: |
            pip install -r build_tools/github/lint_lock.txt
      - run:
          name: linting
          command: ./build_tools/linting.sh

  doc-min-dependencies:
    machine:
      <<: *machine_image
    # medium.gen3 2 vCPUs 8GiB mem -- same core count as the Docker `medium` this
    # job used to run on, with twice the memory. This build only checks that the
    # docs still build against the minimum dependencies and gates nothing else in
    # the workflow, so it does not need the extra cores that the `doc` job gets
    resource_class: medium.gen3
    environment:
      - MKL_NUM_THREADS: 2
      - OPENBLAS_NUM_THREADS: 2
      - CONDA_ENV_NAME: testenv
      - LOCK_FILE: build_tools/circle/doc_min_dependencies_linux-64_conda.lock
      # Do not fail if the documentation build generates warnings with minimum
      # dependencies as long as we can avoid raising warnings with more recent
      # versions of the same dependencies.
      - SKLEARN_WARNINGS_AS_ERRORS: '0'
    steps:
      - checkout
      - run: ./build_tools/circle/checkout_merge_commit.sh
      # Cache keys are matched by prefix. The second key makes a build that has
      # no cache of its own, e.g. the first build of a branch, start from the
      # datasets downloaded by the last build of main instead of from scratch.
      # The third key uses the cache created by _any_ previous build. This is
      # a useful fallback for PRs from contributors who don't have a cache
      # for `main`.
      # Caches are not shared across repositories. This means that the
      # scikit-learn/scikit-learn cache is not used by PRs from <user>/scikit-learn.
      - restore_cache:
          keys:
            - v1-doc-min-deps-datasets-{{ .Branch }}
            - v1-doc-min-deps-datasets-main
            - v1-doc-min-deps-datasets
      - restore_cache:
          keys:
            - doc-min-deps-ccache-{{ .Branch }}
            - doc-min-deps-ccache
      - run: ./build_tools/circle/build_doc.sh
      - save_cache:
          key: doc-min-deps-ccache-{{ .Branch }}-{{ .BuildNum }}
          paths:
            - ~/.ccache
            - ~/.cache/pip
      - save_cache:
          key: v1-doc-min-deps-datasets-{{ .Branch }}
          paths:
            - ~/scikit_learn_data
      - store_artifacts:
          path: doc/_build/html/stable
          destination: doc
      - store_artifacts:
          path: ~/log.txt
          destination: log.txt

  doc:
    machine:
      <<: *machine_image
    # large.gen3 4 vCPUs 16GiB mem -- more cores and memory than the Docker
    # `medium+` this job used to run on, which the parallel doc build makes use of
    resource_class: large.gen3
    environment:
      - MKL_NUM_THREADS: 2
      - OPENBLAS_NUM_THREADS: 2
      - CONDA_ENV_NAME: testenv
      - LOCK_FILE: build_tools/circle/doc_linux-64_conda.lock
      # Make sure that we fail if the documentation build generates warnings with
      # recent versions of the dependencies.
      - SKLEARN_WARNINGS_AS_ERRORS: '1'
    steps:
      - checkout
      - run: ./build_tools/circle/checkout_merge_commit.sh
      # Cache keys are matched by prefix. The second key makes a build that has
      # no cache of its own, e.g. the first build of a branch, start from the
      # datasets downloaded by the last build of main instead of from scratch.
      # The third key uses the cache created by _any_ previous build. This is
      # a useful fallback for PRs from contributors who don't have a cache
      # for `main`.
      # Caches are not shared across repositories. This means that the
      # scikit-learn/scikit-learn cache is not used by PRs from <user>/scikit-learn.
      - restore_cache:
          keys:
            - v1-doc-datasets-{{ .Branch }}
            - v1-doc-datasets-main
            - v1-doc-datasets
      - restore_cache:
          keys:
            - doc-ccache-{{ .Branch }}
            - doc-ccache
      - run: ./build_tools/circle/build_doc.sh
      - save_cache:
          key: doc-ccache-{{ .Branch }}-{{ .BuildNum }}
          paths:
            - ~/.ccache
            - ~/.cache/pip
      - save_cache:
          key: v1-doc-datasets-{{ .Branch }}
          paths:
            - ~/scikit_learn_data
      - store_artifacts:
          path: doc/_build/html/stable
          destination: doc
      - store_artifacts:
          path: ~/log.txt
          destination: log.txt
      # Persists generated documentation so that it can be attached and deployed
      # in the 'deploy' step.
      - persist_to_workspace:
          root: doc/_build/html
          paths: .

  deploy:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run: ./build_tools/circle/checkout_merge_commit.sh
      # Attach documentation generated in the 'doc' step so that it can be
      # deployed.
      - attach_workspace:
          at: doc/_build/html
      - run: ls -ltrh doc/_build/html/stable
      - run:
          command: |
            if [[ "${CIRCLE_BRANCH}" =~ ^main$|^[0-9]+\.[0-9]+\.X$ ]]; then
              bash build_tools/circle/push_doc.sh doc/_build/html/stable
            fi

workflows:
  version: 2
  build-doc-and-deploy:
    jobs:
      - lint
      - doc:
          requires:
            - lint
      - doc-min-dependencies:
          requires:
            - lint
      - deploy:
          requires:
            - doc
